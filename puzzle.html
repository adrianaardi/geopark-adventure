<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clean Square Puzzle Mechanics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Mobile touch optimization */
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        /* Responsive container maintaining ~1600:1012 (1.58:1) aspect ratio */
        .puzzle-board-container {
            width: min(92vw, 420px);
            aspect-ratio: 1600 / 1012;
            position: relative;
        }

        /* 3x3 Tile Grid */
        .puzzle-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            background-color: #d1d5db;
        }

        /* Square/Rectangular Tile Styling */
        .tile {
            width: 100%;
            height: 100%;
            cursor: pointer;
            background-repeat: no-repeat;
            /* Match grid size (3x3 = 300% width and height) */
            background-size: 300% 300%;
            transition: border 0.1s ease, transform 0.1s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* Highlighted state when tapped for swapping */
        .tile.selected {
            border: 3px solid #2563eb;
            transform: scale(0.96);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
            z-index: 10;
        }

        /* Green indicator outline when tile is in correct slot */
        .tile.correct {
            border-bottom: 2px solid #22c55e;
        }
    </style>
</head>
<body>

    <header class="w-full max-w-sm flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
        <div>
            <h1 class="font-bold text-base text-gray-900">Frog Puzzle</h1>
            <p class="text-xs text-gray-500">Tap two tiles to swap</p>
        </div>
        <div class="text-right">
            <span class="text-xs text-gray-400 font-semibold block uppercase">Progress</span>
            <span id="pct-display" class="text-xl font-black text-blue-600">0%</span>
        </div>
    </header>

    <!-- Main Game Board Container -->
    <main class="my-auto flex flex-col items-center gap-3">
        <div class="puzzle-board-container bg-gray-200 p-1.5 rounded-xl shadow-inner border border-gray-300">
            <div id="board" class="puzzle-grid rounded-lg overflow-hidden">
                <!-- 9 Tiles rendered dynamically by JS -->
            </div>
        </div>

        <!-- Touch Feedback Status Message -->
        <div id="status-msg" class="text-center text-sm font-medium text-gray-600 h-5">
            Tap any tile to start swapping
        </div>
    </main>

    <!-- Control Buttons -->
    <footer class="w-full max-w-sm flex flex-col gap-2">
        <button id="reset-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold rounded-xl shadow transition">
            Shuffle Puzzle
        </button>
        		<a class="back-link" href="index.html">Back to home</a>

    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Primary local file path (1600x1012 image)
        const LOCAL_IMAGE = 'images/frog-puzzle.jpeg';
        // Online fallback image in case file is not found locally during testing
        const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=800&q=80';

        const GRID_SIZE = 3;
        const TOTAL_TILES = 9;

        let boardState = [];
        let selectedIndex = null;
        let activeImage = LOCAL_IMAGE;

        const boardEl = document.getElementById('board');
        const pctEl = document.getElementById('pct-display');
        const statusEl = document.getElementById('status-msg');
        const resetBtn = document.getElementById('reset-btn');

        // Verify local image existence, fallback if missing
        const imgTest = new Image();
        imgTest.src = LOCAL_IMAGE;
        imgTest.onerror = () => {
            activeImage = FALLBACK_IMAGE;
            renderBoard();
        };

        /**
         * Initialize or Shuffle the Game Board
         */
        function initGame() {
            selectedIndex = null;

            // Generate solvable shuffled array
            boardState = Array.from({ length: TOTAL_TILES }, (_, i) => i);
            do {
                for (let i = boardState.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [boardState[i], boardState[j]] = [boardState[j], boardState[i]];
                }
            } while (calculatePercentage() === 100); // Ensure it doesn't start solved

            renderBoard();
            updatePercentage();
            statusEl.textContent = "Tap any tile to start swapping";
            statusEl.className = "text-center text-sm font-medium text-gray-600 h-5";
        }

        /**
         * Render 3x3 Tile Grid with correct image background crops
         */
        function renderBoard() {
            boardEl.innerHTML = '';

            boardState.forEach((pieceId, currentSlot) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.style.backgroundImage = `url('${activeImage}')`;

                // Calculate 3x3 grid background crop positions
                const row = Math.floor(pieceId / GRID_SIZE);
                const col = pieceId % GRID_SIZE;
                
                // 0%, 50%, 100% background offsets
                const bgX = col * 50;
                const bgY = row * 50;
                tile.style.backgroundPosition = `${bgX}% ${bgY}%`;

                // Highlight selected tile
                if (selectedIndex === currentSlot) {
                    tile.classList.add('selected');
                }

                // Green border indicator if tile is in correct slot
                if (pieceId === currentSlot) {
                    tile.classList.add('correct');
                }

                // Handle mobile touch tap
                tile.addEventListener('click', () => handleTap(currentSlot));

                boardEl.appendChild(tile);
            });
        }

        /**
         * Tap-to-Swap logic for mobile touchscreens
         */
        function handleTap(slotIndex) {
            // First tap: Select tile
            if (selectedIndex === null) {
                selectedIndex = slotIndex;
                statusEl.textContent = `Tile selected. Tap another to swap.`;
            } 
            // Tap same tile again: Deselect
            else if (selectedIndex === slotIndex) {
                selectedIndex = null;
                statusEl.textContent = "Deselected tile.";
            } 
            // Second tap: Swap tiles
            else {
                const prev = selectedIndex;
                [boardState[prev], boardState[slotIndex]] = [boardState[slotIndex], boardState[prev]];
                selectedIndex = null;
                statusEl.textContent = "Tiles swapped!";
            }

            renderBoard();
            updatePercentage();
        }

        /**
         * Calculate accuracy percentage (0% to 100%)
         */
        function calculatePercentage() {
            let correctCount = 0;
            boardState.forEach((pieceId, slotIndex) => {
                if (pieceId === slotIndex) correctCount++;
            });
            return Math.round((correctCount / TOTAL_TILES) * 100);
        }

        /**
         * Update UI percentage and win status
         */
        function updatePercentage() {
            const pct = calculatePercentage();
            pctEl.textContent = `${pct}%`;

            if (pct === 100) {
                statusEl.textContent = "🎉 Solved! 100% Completed";
                statusEl.className = "text-center text-sm font-bold text-green-600 h-5";
            }
        }

        resetBtn.addEventListener('click', initGame);

        // Start game on page load
        initGame();
    </script>
</body>
</html>
