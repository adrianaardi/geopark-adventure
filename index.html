<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geopark Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="home-page">
        <div class="home-logos">
            <img class="home-logo" src="images/logo.png" alt="Sarawak Delta Geopark logo" onerror="this.style.display='none'">
        </div>

        <div class="home-title">
            <img src="images/swk-delta-nobg.png" alt="Sarawak Delta Geopark logo" onerror="this.style.display='none'">
        </div>
        <h2 class="home-tagline">Borneo's Cradle of Origin</h2>
        <p class="home-badge">Explore • Learn • Play</p>

        <h3 class="home-subtitle">Choose Your Adventure</h3>

        <nav class="card-list">
            <a class="home-link quiz" href="geoparkquiz.html">
                <span class="card-icon" aria-hidden="true">🧠</span>
                <span class="card-text">
                    <span class="card-label">Geopark Quiz</span>
                    <span class="card-title">Test your knowledge</span>
                </span>
                <span class="card-play" aria-hidden="true">▶</span>
            </a>

            <a class="home-link geologist" href="jrgeologist.html">
                <span class="card-icon" aria-hidden="true">🪨</span>
                <span class="card-text">
                    <span class="card-label">Junior Geologist</span>
                    <span class="card-title">Discover earth's secrets</span>
                </span>
                <span class="card-play" aria-hidden="true">▶</span>
            </a>

            <a class="home-link puzzle" href="puzzle.html">
                <span class="card-icon" aria-hidden="true">🧩</span>
                <span class="card-text">
                    <span class="card-label">Picture Puzzle</span>
                    <span class="card-title">Piece together Sarawak's heritage</span>
                </span>
                <span class="card-play" aria-hidden="true">▶</span>
            </a>
        </nav>

        <div class="lang-switch">
            <span class="lang-globe" aria-hidden="true">🌐</span>
            <div class="lang-toggle" role="group" aria-label="Language">
                <a class="lang-btn active" href="index.html" lang="en" aria-current="true">EN</a>
                <a class="lang-btn" href="index-bm.html" lang="ms">BM</a>
            </div>
        </div>
    </main>
</body>
</html>
